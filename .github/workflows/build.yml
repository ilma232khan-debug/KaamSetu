name: Build KaamSetu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          unzip -o "$ZIP_FILE" -d project

      - name: Find Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaamSetu-APK
          path: "project/**/build/outputs/apk/debug/*.apk"
